name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml", "polytabletop-web/**", "polytabletop-core/**", "polytabletop-games/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Motorul WebAssembly pentru docs/play (jocul in browser). Daca pasul esueaza, site-ul se publica oricum, fara /play/pkg.
      - name: Build WebAssembly engine
        id: wasm
        continue-on-error: true
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
          CARGO_INCREMENTAL: "0"
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
          cargo build -p polytabletop-web --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --no-typescript --out-dir docs/play/pkg target/wasm32-unknown-unknown/release/polytabletop_web.wasm
          ls -la docs/play/pkg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

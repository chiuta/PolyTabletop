name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04,     target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: macos-arm64 }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: GUI libraries (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo build --release --target ${{ matrix.target }} -p polytabletop -p polytabletop-rpg -p polytabletop-gui
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          dir="polytabletop-${tag}-${{ matrix.name }}"
          mkdir "$dir"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for b in polytabletop polytabletop-gui polytabletop-rpg; do
            cp "target/${{ matrix.target }}/release/${b}${ext}" "$dir/"
          done
          cp README.md CHANGELOG.md "$dir/"
          cp -r completions man "$dir/"
          cp LICENSE* "$dir/" 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${dir}.zip" "$dir" >/dev/null
            sha256sum "${dir}.zip" > "${dir}.zip.sha256"
          else
            tar czf "${dir}.tar.gz" "$dir"
            if command -v sha256sum >/dev/null; then sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
            else shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            polytabletop-*.tar.gz
            polytabletop-*.zip
            polytabletop-*.sha256

  publish:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && sha256sum polytabletop-*.tar.gz polytabletop-*.zip > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
